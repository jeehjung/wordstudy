<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordstudy · LLM 연결 테스트</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; line-height: 1.55; }
    h1 { line-height: 1.2; }
    label { display: block; font-weight: 650; margin: 16px 0 6px; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 10px; font: inherit; }
    textarea { min-height: 140px; resize: vertical; }
    button { margin-top: 14px; cursor: pointer; font-weight: 700; }
    .hint { opacity: .75; font-size: .92rem; }
    #status, #answer { border: 1px solid #8886; border-radius: 10px; padding: 12px; margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Wordstudy · LLM 연결 테스트</h1>
  <p>Groq를 먼저 호출하고, 사용량 제한 또는 일시적인 장애가 발생하면 Gemini 3.5 Flash-Lite로 자동 전환합니다.</p>
  <p class="hint">이 페이지는 연결 확인용 시작 화면입니다. 실제 Wordstudy 학습 UI가 있다면 Worker URL을 설정한 뒤 해당 앱의 LLM 호출 주소를 Worker 주소로 변경하면 됩니다.</p>

  <label for="workerUrl">Cloudflare Worker URL</label>
  <input id="workerUrl" type="url" placeholder="https://wordstudy-llm-api.계정.workers.dev">
  <label for="prompt">질문</label>
  <textarea id="prompt">영어 단어 "resilient"의 뜻을 한국어로 설명하고, 짧은 예문 1개를 만들어줘.</textarea>
  <button id="send">LLM 호출</button>
  <div id="status" role="status">Worker URL을 입력한 뒤 호출해 주세요.</div>
  <div id="answer" aria-live="polite">응답이 여기에 표시됩니다.</div>

  <script>
    const urlInput = document.querySelector("#workerUrl");
    const promptInput = document.querySelector("#prompt");
    const status = document.querySelector("#status");
    const answer = document.querySelector("#answer");
    const send = document.querySelector("#send");

    send.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      const prompt = promptInput.value.trim();
      if (!url || !prompt) {
        status.textContent = "Worker URL과 질문을 입력해 주세요.";
        return;
      }
      send.disabled = true;
      status.textContent = "요청 중…";
      answer.textContent = "";
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: [
              { role: "system", content: "너는 영어 단어 학습을 돕는 한국어 튜터다. 간결하고 정확하게 답한다." },
              { role: "user", content: prompt }
            ],
            temperature: 0.3,
            max_tokens: 700
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "HTTP " + response.status);
        const text = data.choices?.[0]?.message?.content || "(응답 텍스트가 없습니다.)";
        status.textContent = "응답 제공: " + (data.provider || "unknown") +
          " · 모델: " + (data.model || "unknown") +
          (data.fallback ? " · Groq 한도/장애로 Gemini 대체 사용" : "");
        answer.textContent = text;
      } catch (error) {
        status.textContent = "오류: " + error.message;
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
